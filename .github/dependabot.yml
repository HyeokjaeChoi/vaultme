# Version updates wait 7 days, the same as pnpm minimumReleaseAge (pnpm-workspace.yaml).
# Expo SDK pins react, react-native and expo-* together: upgrade them with `npx expo install --fix`, not one by one.
# update-types limits ignore to version updates; Dependabot security updates still open for these.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['expo', 'expo-*', '@expo/*', 'react', 'react-dom', 'react-native', 'react-native-*']
    ignore:
      - dependency-name: 'expo'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'expo-*'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@expo/*'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-native'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: 'react-native-*'
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
