name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-repo-rules.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # oasdiff reads the base branch's docs/openapi/v1.json from git
      - if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('package.json') != ''
        run: pnpm exec prettier --check .
      - if: hashFiles('package.json') != ''
        run: pnpm turbo run typecheck lint test
      # Reorg tests (#316, Q67) need anvil. foundry-toolchain v1.9.2 (2026-10-22), Foundry v1.8.6 (2026-10-21): both older than 7 days.
      - if: hashFiles('package.json') != ''
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/api test:reorg
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/api openapi:check
      # Q61: fail on a breaking change of the API contract against the PR base. openapi:check just proved the committed
      # file equals the generated document. `review: false` and an empty token: no upload of the spec, no PR comment
      # (the job has read-only permissions). oasdiff-action v0.1.20 (2026-10-21, docker action).
      - if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@9ce3a29eb0e6478dd0140932a678c7fb59d08f22 # v0.1.20
        with:
          base: origin/${{ github.base_ref }}:docs/openapi/v1.json
          revision: docs/openapi/v1.json
          fail-on: ERR
          review: 'false'
          github-token: ''
      # Package boundaries (undeclared deps, imports outside a package). Experimental in turbo 2.11, so it only reports.
      # Make it blocking when turbo marks the command stable.
      - if: hashFiles('package.json') != ''
        continue-on-error: true
        run: pnpm turbo boundaries
      - if: hashFiles('package.json') != ''
        run: pnpm knip
      # Bundles both platforms, so a broken import or asset fails here, not on a device.
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/mobile run export:check
      # Performance numbers per run (ADR-0019): the Hermes bundle sizes.
      # Also when export:check failed (a bundle over the limit): that is the run whose numbers matter.
      - if: ${{ !cancelled() && hashFiles('apps/mobile/dist/**/*.hbc') != '' }}
        run: node packages/perf/src/cli.ts hermes apps/mobile/dist perf-hermes.json
      - if: ${{ !cancelled() && hashFiles('package.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-hermes
          path: perf-hermes.json
          retention-days: 90
          if-no-files-found: warn
      # Report-only: expo-doctor wants the newest SDK 58 patches (expo 58.0.19, expo-router 58.0.26, published 2026-10-23),
      # which pass the 7-day rule on 2026-10-30. Then run `npx expo install --fix` and remove continue-on-error.
      - if: hashFiles('package.json') != ''
        continue-on-error: true
        run: pnpm --filter @vaultme/mobile run doctor

  # apps/web quality gates (ADR-0012): the built site runs on the Workers Static Assets runtime (wrangler dev), then
  # Playwright (status codes, headers, theme, axe = 0 violations) and Lighthouse CI (4 categories >= 95, JS <= 100 KB gzip)
  # run against it. Lighthouse runs one job per profile, in parallel (issue #249: one serial job took 12-13 min of lhci
  # and hit the 20-minute limit). Lighthouse uses the Chrome of ubuntu-latest; Playwright installs its own headless
  # shell without `--with-deps`: the runner already has the system libraries, and the apt step once took 10 min.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
      - run: pnpm --filter @vaultme/web exec playwright install --only-shell chromium
      - run: pnpm --filter @vaultme/web run test:e2e

  lhci:
    name: lhci (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
      - run: pnpm --filter @vaultme/web run lhci:${{ matrix.profile }}
      # Performance numbers per run (ADR-0019): the Lighthouse reports and js-budget.json, also when a gate fails.
      # `.lighthouseci` is a hidden folder; the *.json filter leaves out the HTML reports.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-lhci-${{ matrix.profile }}
          path: apps/web/.lighthouseci/*.json
          include-hidden-files: true
          retention-days: 90
