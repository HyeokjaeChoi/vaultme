name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-repo-rules.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('package.json') != ''
        run: pnpm exec prettier --check .
      - if: hashFiles('package.json') != ''
        run: pnpm turbo run typecheck lint test
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/api openapi:check
      # Package boundaries (undeclared deps, imports outside a package). Experimental in turbo 2.11, so it only reports.
      # Make it blocking when turbo marks the command stable.
      - if: hashFiles('package.json') != ''
        continue-on-error: true
        run: pnpm turbo boundaries
      - if: hashFiles('package.json') != ''
        run: pnpm knip
      # Bundles both platforms, so a broken import or asset fails here, not on a device.
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/mobile run export:check
      # Report-only: expo-doctor wants the newest SDK 58 patches (expo 58.0.19, expo-router 58.0.26, published 2026-10-23),
      # which pass the 7-day rule on 2026-10-30. Then run `npx expo install --fix` and remove continue-on-error.
      - if: hashFiles('package.json') != ''
        continue-on-error: true
        run: pnpm --filter @vaultme/mobile run doctor

  # apps/web quality gates (ADR-0012): the built site runs on the Workers Static Assets runtime (wrangler dev), then
  # Playwright (status codes, headers, theme, axe = 0 violations) and Lighthouse CI (4 categories >= 95, JS <= 100 KB gzip,
  # desktop and mobile profiles) run against it. Chrome comes with ubuntu-latest; Playwright installs its own.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
      - run: pnpm --filter @vaultme/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vaultme/web run test:e2e
      - run: pnpm --filter @vaultme/web run lhci
