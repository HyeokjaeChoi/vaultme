name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels that PR's older run; a run without a PR has its own group (a pending one is never replaced).
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12 (WF-1): release binary checked against its published sha256 (actionlint_1.7.12_checksums.txt). shellcheck is on the runner.
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/check-repo-rules.sh
        env:
          REQUIRE_ACTIONLINT: '1'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # MOB-3: download the perf-hermes artifact of the last green main run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # oasdiff reads the base branch's docs/openapi/v1.json from git
      - if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('package.json') != ''
        run: pnpm exec prettier --check .
      - if: hashFiles('package.json') != ''
        run: pnpm turbo run typecheck lint test
      # Reorg tests (#316, Q67) need anvil. foundry-toolchain v1.9.2 (2026-10-22), Foundry v1.8.6 (2026-10-21): both older than 7 days.
      - if: hashFiles('package.json') != ''
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/api test:reorg
      # Send lifecycle on anvil with the real app code (CHAIN-3): 9 cases, chain id 11155111, suite <= 60 s.
      - if: hashFiles('package.json') != ''
        run: timeout 60 pnpm --filter @vaultme/mobile test:anvil
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/api openapi:check
      # PROD-1: the production env blocks (unused until the first public release, ADR-0025) still build and validate.
      # --dry-run needs no Cloudflare token and uploads nothing. A config warning (unknown field) also fails the step.
      - if: hashFiles('package.json') != ''
        run: scripts/wrangler-dry-run.sh @vaultme/api "$RUNNER_TEMP/api-production"
      # API-10: the Worker bundle stays within measured size + 25 % (apps/api/scripts/bundle-budget.json). The script builds the
      # Worker itself (wrangler dry run), so no separate build step. Its output is kept for the evidence file below.
      - if: hashFiles('package.json') != ''
        run: set -o pipefail; pnpm --filter @vaultme/api bundle:budget | tee bundle-budget.log
      # EVID-1 (ADR-0043): the same numbers as an evidence file (also when the budget failed: that is the run that matters).
      - if: ${{ !cancelled() && hashFiles('bundle-budget.log') != '' }}
        run: |
          grep -q '^gzipBytes:' bundle-budget.log || exit 0 # the script failed before it printed: its own step already shows why
          budget() { grep "^$1:" bundle-budget.log | sed -E 's/.*budget ([0-9]+)\).*/\1/'; }
          value() { grep "^$1:" bundle-budget.log | sed -E "s/^$1: ([0-9]+) .*/\1/"; }
          node packages/perf/src/cli.ts evidence emit --gate API-10 --origin 'GitHub Actions ubuntu-latest, job verify' \
            --tool 'apps/api/scripts/bundle-budget.ts, wrangler deploy --dry-run' --out evidence-API-10.json \
            --result "{\"metric\":\"Worker bundle, raw\",\"value\":$(value rawBytes),\"unit\":\"B\",\"threshold\":{\"op\":\"<=\",\"value\":$(budget rawBytes)},\"n\":1,\"window\":\"one build\"}" \
            --result "{\"metric\":\"Worker bundle, gzip\",\"value\":$(value gzipBytes),\"unit\":\"B\",\"threshold\":{\"op\":\"<=\",\"value\":$(budget gzipBytes)},\"n\":1,\"window\":\"one build\"}"
      - if: ${{ !cancelled() && hashFiles('evidence-API-10.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-API-10
          path: evidence-API-10.json
          retention-days: 90
      # Drizzle schema vs committed migrations (#355, ADR-0029): fails when apps/api/src/db/schema.ts changed without `db:generate`.
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/api db:check
      # Q61: fail on a breaking change of the API contract against the PR base. openapi:check just proved the committed
      # file equals the generated document. `review: false` and an empty token: no upload of the spec, no PR comment
      # (the job has read-only permissions). oasdiff-action v0.1.20 (2026-10-21, docker action).
      - if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@9ce3a29eb0e6478dd0140932a678c7fb59d08f22 # v0.1.20
        with:
          base: origin/${{ github.base_ref }}:docs/openapi/v1.json
          revision: docs/openapi/v1.json
          fail-on: ERR
          review: 'false'
          github-token: ''
      # Package boundaries (undeclared deps, imports outside a package). Experimental in turbo 2.11, so it only reports.
      # Make it blocking when turbo marks the command stable.
      - if: hashFiles('package.json') != ''
        continue-on-error: true
        run: pnpm turbo boundaries
      - if: hashFiles('package.json') != ''
        run: pnpm knip
      # Bundles both platforms, so a broken import or asset fails here, not on a device.
      - if: hashFiles('package.json') != ''
        run: pnpm --filter @vaultme/mobile run export:check
      # Performance numbers per run (ADR-0019): the Hermes bundle sizes.
      # Also when export:check failed (a bundle over the limit): that is the run whose numbers matter.
      - if: ${{ !cancelled() && hashFiles('apps/mobile/dist/**/*.hbc') != '' }}
        run: node packages/perf/src/cli.ts hermes apps/mobile/dist perf-hermes.json
      - if: ${{ !cancelled() && hashFiles('package.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-hermes
          path: perf-hermes.json
          retention-days: 90
          if-no-files-found: warn
      # MOB-3: a bundle that grows more than 100 KiB against main prints a ::warning:: (the 11 MiB fail stays in export:check).
      # Compares with perf-hermes.json of the last green push run of main; no such run or artifact (expired): a notice, no failure.
      - if: ${{ github.event_name == 'pull_request' && !cancelled() && hashFiles('perf-hermes.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty') || id=''
          if [ -z "$id" ] || ! gh run download "$id" --name perf-hermes --dir main-hermes; then
            echo "::notice::No perf-hermes.json of main to compare with"
            exit 0
          fi
          node packages/perf/src/cli.ts hermes-growth perf-hermes.json main-hermes/perf-hermes.json "$GITHUB_STEP_SUMMARY" ||
            echo "::notice::The growth check could not read a perf-hermes.json"
      # EVID-1 (ADR-0043): the same numbers as an evidence file, committed later with `evidence collect --run <id>` (last attempt of a re-run only).
      - if: ${{ !cancelled() && hashFiles('perf-hermes.json') != '' }}
        run: >
          node packages/perf/src/cli.ts evidence emit --gate hermes-size --origin 'GitHub Actions ubuntu-latest, job verify'
          --tool 'expo export, size read by packages/perf cli.ts hermes' --out evidence-hermes-size.json --from hermes=perf-hermes.json
      - if: ${{ !cancelled() && hashFiles('evidence-hermes-size.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-hermes-size
          path: evidence-hermes-size.json
          retention-days: 90
      # Report-only: expo-doctor wants the newest SDK 58 patches (expo 58.0.19, expo-router 58.0.26, published 2026-10-23),
      # which pass the 7-day rule on 2026-10-30. Then run `npx expo install --fix` and remove continue-on-error.
      - if: hashFiles('package.json') != ''
        continue-on-error: true
        run: pnpm --filter @vaultme/mobile run doctor

  # apps/web quality gates (ADR-0012): the built site runs on the Workers Static Assets runtime (wrangler dev), then
  # Playwright (status codes, headers, theme, axe = 0 violations) and Lighthouse CI (4 categories >= 95, JS <= 100 KB gzip)
  # run against it. Lighthouse runs one job per profile, in parallel (issue #249: one serial job took 12-13 min of lhci
  # and hit the 20-minute limit). Lighthouse uses the Chrome of ubuntu-latest; Playwright installs its own headless
  # shell without `--with-deps`: the runner already has the system libraries, and the apt step once took 10 min.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
      # PROD-1: the production env block of apps/web/wrangler.jsonc (config only; needs the build for the assets directory).
      - run: scripts/wrangler-dry-run.sh @vaultme/web "$RUNNER_TEMP/web-production"
      - run: pnpm --filter @vaultme/web exec playwright install --only-shell chromium
      - run: pnpm --filter @vaultme/web run test:e2e

  lhci:
    name: lhci (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
      - run: pnpm --filter @vaultme/web run lhci:${{ matrix.profile }}
      # Performance numbers per run (ADR-0019): the Lighthouse reports and js-budget.json, also when a gate fails.
      # `.lighthouseci` is a hidden folder; the *.json filter leaves out the HTML reports.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-lhci-${{ matrix.profile }}
          path: apps/web/.lighthouseci/*.json
          include-hidden-files: true
          retention-days: 90
      # EVID-1 (ADR-0043): one evidence file per run, from the desktop job (the mobile job measures the same JS bytes).
      - if: ${{ !cancelled() && matrix.profile == 'desktop' && hashFiles('apps/web/.lighthouseci/js-budget.json') != '' }}
        run: >
          node packages/perf/src/cli.ts evidence emit --gate js-budget --origin 'GitHub Actions ubuntu-latest, job lhci (desktop)'
          --tool 'apps/web/scripts/js-budget.ts, gzip level 9 of the app JS' --out evidence-js-budget.json --from js-budget=apps/web/.lighthouseci/js-budget.json
      - if: ${{ !cancelled() && matrix.profile == 'desktop' && hashFiles('evidence-js-budget.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-js-budget
          path: evidence-js-budget.json
          retention-days: 90
