name: web-preview

# Uploads a preview version of apps/web for each PR as an alias on the staging Worker (not deployed to staging traffic):
# https://pr-<n>-vaultme-web-staging.<account>.workers.dev (ADR-0001: `wrangler versions upload --preview-alias`).
# Skipped for fork and bot PRs (the Cloudflare token must not reach untrusted code).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      [
        apps/web/**,
        packages/tokens/**,
        packages/i18n/**,
        packages/config/**,
        pnpm-lock.yaml,
        .github/workflows/web-preview.yml,
      ]

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]'
    # Not verified on a real account yet (needs the first staging deploy of the Worker, see ADR-0001 "Not verified").
    # Remove continue-on-error after the first green run.
    continue-on-error: true
    environment: staging
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
      - name: Upload version with alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if ! pnpm --filter @vaultme/web exec wrangler versions upload --env staging --preview-alias "pr-$PR" 2>&1 | tee upload.log; then
            # Wrangler cannot upload a version of a Worker that was never deployed. The web-staging workflow creates it on the first merge to main.
            grep -q 'does not yet exist' upload.log && { echo "::notice::No preview: the staging Worker does not exist yet (first web-staging deploy creates it)."; exit 0; }
            exit 1
          fi
          { echo '### Preview'; grep -Eo 'https://[^ ]+workers\.dev' upload.log | sort -u; } >> "$GITHUB_STEP_SUMMARY"
