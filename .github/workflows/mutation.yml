# Mutation score floor for packages/wallet-core and packages/history (MUT-1, quality-gates plan, owner decision 10: required check).
# Stryker changes the code (a `<` becomes `<=`, a guard is removed) and runs the tests: a mutant no test notices is a test that runs
# code but asserts nothing. `thresholds.break` in each `packages/*/stryker.config.json` is the first measured score rounded down to a
# multiple of 5 (never below 60); it only goes up. Target 80 or more.
# Required check = the job `mutation`. It is always created, so it always reports: when a PR touches neither package it does its
# work in no step and passes (a workflow-level `paths:` filter would leave the check missing and block the merge, like e2e.yml).
name: mutation

on:
  pull_request:
  workflow_dispatch: # runs both packages whatever the diff

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(packages/(wallet-core|history)/|\.github/workflows/mutation\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  mutation:
    needs: changes
    # A failed `changes` job must not skip this one (a skipped job passes the required check): then it runs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/wallet-core... --filter @vaultme/history...
      # Stryker 10.1.1 (published 2026-10-23, older than 7 days). Both packages run, so one required check covers both; the first failure still lets the second run.
      - id: wallet-core
        run: pnpm --filter @vaultme/wallet-core run mutation
        continue-on-error: true
      - id: history
        run: pnpm --filter @vaultme/history run mutation
        continue-on-error: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            packages/wallet-core/reports/mutation
            packages/history/reports/mutation
          retention-days: 14
          if-no-files-found: warn
      - if: ${{ steps.wallet-core.outcome != 'success' || steps.history.outcome != 'success' }}
        run: |
          echo "::error::mutation score under the floor (wallet-core: ${{ steps.wallet-core.outcome }}, history: ${{ steps.history.outcome }}); see the clear-text table above"
          exit 1
