name: claude-code-review

# Claude reviews a PR once when it is ready (opened as non-draft, or marked ready), and again each time the owner adds
# the `review` label (docs/agents/workflow.md step 7). No `synchronize`: work-in-progress pushes use no quota.
# The review is the repo skill .claude/skills/vaultme-pr-review (REVIEW.md, issue #212). A PR cannot change its own
# reviewer: the "Knowledge files from the PR base" step puts the PR-base .claude/ in place before any Claude run.
#
# The API key has no write path (issue #539). The job that holds the key (`review`) has a read-only token and read-only
# tools; Claude returns the review as JSON (`--json-schema`), a step without the model checks that the result does not
# hold the key, and only then is it uploaded. The job that writes (`post`) never sees the key: it validates the JSON,
# redacts token shapes and posts with `gh api` (scripts/review-output.py). R17 fails if the key job gets a write tool,
# a write permission or the key moves.
#
# Two stages (issue #486):
# 1. Job `review`: `claude -p` with ANTHROPIC_API_KEY (Console API credits, promo credits included). Calls through claude-code-action
#    count as "Claude Code use" and get no API promo credits, so the CLI runs directly.
#    https://support.claude.com/en/articles/17154008
# 2. Job `fallback`: claude-code-action with CLAUDE_CODE_OAUTH_TOKEN (subscription quota), only when stage 1 had no key (reason
#    `no-key`) or ended with a used-up credit or a rate limit (reason `quota`), and no review summary exists for the
#    head SHA. Any other failure (CLI error, timeout, invalid key, a run that ended without posting) fails the job with
#    its reason and spends no subscription quota (issue #518). The summary comment starts with a marker,
#    `<!-- ai-review:<head sha> -->`, so the fallback never posts a second summary.
# Based on https://code.claude.com/docs/en/github-actions#run-a-skill
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

# A label other than `review` gets its own group: `gh pr create --label` sends `opened` and `labeled` together, and the
# skipped `labeled` run cancelled the real review (#307, seen on #308).
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'review' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Fork PRs get no secrets, so they skip; the owner reviews them by hand.
    # Bot PRs (Renovate, Dependabot) skip too: claude-code-action rejects bot actors, so the check would always fail.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'review') ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Read only, on purpose: the key and the model live here. A write permission here fails R17.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      reason: ${{ steps.api.outputs.reason }}
      api: ${{ steps.api.outcome }}
    env:
      PR: ${{ github.event.pull_request.number }}
      # Read tools only, no Bash at all (a Bash subprocess holds the key in its env and `gh -R host` is a way out, #539). The PR
      # text and diff are fetched by a step without the key into .review-input/. Claude returns JSON; it posts nothing. Sonnet runs the skill and the finders
      # (.claude/agents/review-finder.md); Opus verifies (review-verifier.md).
      ALLOWED_TOOLS: Read,Glob,Grep,Agent
      SYSTEM_PROMPT: This repository keeps its project rules in AGENTS.md files and REVIEW.md and has no CLAUDE.md. The working tree holds the PR-base versions of REVIEW.md, AGENTS.md, ARCHITECTURE.md, CONTEXT.md, PRODUCT.md, DESIGN.md, docs/adr and docs/agents; judge the PR by those, not by the PR's edits to them. The head SHA of this PR is ${{ github.event.pull_request.head.sha }}. You have no way to post, so return the review only as the structured output (--json mode of the skill); the workflow adds the marker line and posts it. Never put an environment value, key or token in the output.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # The review rules come from the PR base, never from the PR head (REVIEW.md, issue #212): the head versions of the
      # knowledge files are removed, then the base versions are checked out. `.claude/` (skills, agents, hooks,
      # settings), CLAUDE.md and .mcp.json are in the list because the CLI runs hooks and MCP servers from them with
      # ANTHROPIC_API_KEY in its environment; claude-code-action restores only .claude/ and CLAUDE.md the same way
      # (docs/security.md, v1.0.252). The PR's own edits to these files stay visible in `gh pr diff`.
      # This guards against mistakes and prompt injection, not against a person with write access: a PR can also change this
      # workflow and scripts/review-output.py. R17 (scripts/check-repo-rules.sh) fails if this step moves behind the CLI step.
      - name: Knowledge files from the PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          kb='^(REVIEW|ARCHITECTURE|CONTEXT|PRODUCT|DESIGN)\.md$|(^|/)AGENTS\.md$|^docs/(adr|agents)/|(^|/)\.claude/|(^|/)CLAUDE(\.local)?\.md$|^\.mcp\.json$'
          git ls-files -z | grep -zE "$kb" | xargs -0 -r rm -f
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git ls-tree -r -z --name-only FETCH_HEAD | grep -zE "$kb" | xargs -0 -r git checkout FETCH_HEAD --
          git status --short
      # From a temp dir, without the API key: a PR-controlled .npmrc or install script never sees the key.
      - name: Install Claude Code CLI
        id: cli
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        # The CLI comes from .github/review-cli/package-lock.json (hashes, Scorecard Pinned-Dependencies), version 2.1.302 as
        # claude-code-action v1.0.252 installs it (published 2026-10-16, more than 7 days ago). --ignore-scripts, then the
        # package's own install.cjs: it links the platform binary and without it the CLI refuses to start. The lockfile is
        # PR-controlled like this workflow (a person with write access can change both). Renovate: bump both files together.
        run: |
          cli="$GITHUB_WORKSPACE/.github/review-cli"
          npm ci --ignore-scripts --prefix "$cli" >/dev/null
          node "$cli/node_modules/@anthropic-ai/claude-code/install.cjs" >/dev/null
          echo "$cli/node_modules/.bin" >> "$GITHUB_PATH"
      # No key here. The model has no shell, so it reads the PR through these files (untrusted text, like any PR text).
      - name: PR input for the review
        env:
          GH_TOKEN: ${{ github.token }} # read only
        run: |
          d=.review-input
          mkdir -p "$d/issues"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json number,title,body,headRefOid,baseRefName,isDraft,state,closingIssuesReferences,files > "$d/pr.json"
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$d/diff.patch"
          for n in $(jq -r '.closingIssuesReferences[].number' "$d/pr.json"); do
            gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json title,body > "$d/issues/$n.json"
            # The parent issue of a child issue (its `## Parent` section), at most three.
            for p in $(jq -r '.body' "$d/issues/$n.json" | sed -n '/^## Parent/,/^## /p' | grep -oE '#[0-9]+' | tr -d '#' | sort -u | head -3); do
              gh issue view "$p" --repo "$GITHUB_REPOSITORY" --json title,body > "$d/issues/$p.json" || true
            done
          done
      # Stage 1. Continues on error: the step outputs `reason` (no-key, quota) tell stage 2 whether it may run.
      # The key sits in this step only. The model runs and `review-output.py scan` runs in the same step, so nothing the
      # model wrote is printed or uploaded before the key check.
      - name: Review (API credits, claude -p)
        id: api
        if: steps.cli.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }} # read only: the job has no write permission
          # In -p mode subagents start in the background and Claude can end its turn while they run, so nothing was
          # posted (issue #133). This makes Claude wait for every subagent:
          # https://code.claude.com/docs/en/sub-agents#let-claude-wait-for-a-subagent
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::warning::ANTHROPIC_API_KEY not set; the subscription fallback runs"; echo "reason=no-key" >> "$GITHUB_OUTPUT"; exit 1; }
          # --permission-mode dontAsk: a tool call that is not allowed is denied, never asked. The skill's own allowed-tools
          # lists the posting commands (the fallback and local runs use them); a deny rule wins over it.
          # `Bash` removes the shell tool; Read(//proc) is where a process env is readable.
          denied=('Bash' 'Read(//proc/**)' 'Read(//sys/**)' 'mcp__github_inline_comment__create_inline_comment')
          claude -p "/vaultme-pr-review ${PR} --json" \
            --model sonnet \
            --permission-mode dontAsk \
            --allowedTools "$ALLOWED_TOOLS" \
            --disallowedTools "${denied[@]}" \
            --append-system-prompt "$SYSTEM_PROMPT" \
            --json-schema "$(python3 scripts/review-output.py schema)" \
            --output-format json > "$RUNNER_TEMP/result.json" 2> "$RUNNER_TEMP/claude.err" || true # stderr is never printed
          rc=0
          python3 scripts/review-output.py scan "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/review.json" || rc=$?
          if [ "$rc" = 1 ]; then rm -f "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/review.json"; exit 1; fi
          jq '{is_error, subtype, num_turns, total_cost_usd, result: (.result // "" | .[0:600])}' "$RUNNER_TEMP/result.json"
          # What the CLI refused. The result file passed the key check above.
          jq -r '(.permission_denials // [])[] | "denied: \(.tool_name) \((.tool_input // {}) | tostring | .[0:300])"' "$RUNNER_TEMP/result.json" || true
          if ! jq -e '.is_error == false' "$RUNNER_TEMP/result.json" >/dev/null; then
            # Quota only. `.subtype` is no signal: an invalid key also returns "success". The strings come from the Claude Code
            # binary ("Credit balance is too low", rate_limit_error, billing_error), not from docs; a real credit failure was
            # not reproduced. Any other failure sets no reason, so stage 2 stays off and the job fails (issue #518).
            if jq -e '.is_error == true and ((.result // "") | test("credit balance|rate.?limit|billing_error|\\b429\\b"; "i"))' "$RUNNER_TEMP/result.json" >/dev/null; then
              echo "reason=quota" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          exit "$rc"
      - name: Upload the review
        if: steps.api.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  post:
    # Writes the review. No model and no API key here: the review is a JSON file from the `review` job.
    needs: review
    if: ${{ !cancelled() && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comments; remove the `review` label
    outputs:
      count: ${{ steps.posted.outputs.count }}
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      MARKER: '<!-- ai-review:${{ github.event.pull_request.head.sha }} -->'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # The label asks for one more review; remove it so the owner can add it again after the next fix.
      - if: github.event.action == 'labeled'
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label review
      - name: Start time
        # The marker check counts only comments made after this run started, so a re-review with the `review` label on an
        # unchanged SHA does not take the marker of the earlier review for its own.
        run: echo "START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Download the review
        id: download
        if: needs.review.outputs.api == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review
          path: ${{ runner.temp }}/review
      - name: Post the review
        if: steps.download.outcome == 'success'
        run: python3 scripts/review-output.py post "$RUNNER_TEMP/review/review.json" "$PR" "$SHA"
      # Only a bot comment counts, so a person cannot copy the marker to switch the fallback off.
      - name: Check summary posted
        id: posted
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          n=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            | jq --arg m "$MARKER" --arg start "$START" '[.[] | select(.user.type == "Bot" and .created_at >= $start and (.body | contains($m)))] | length' \
            | awk '{s+=$1} END {print s+0}')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "summary comments for ${SHA}: $n"

  fallback:
    # Stage 2: the subscription runs the review when stage 1 had no key or ran out of credit or rate limit and left no
    # summary. No API key in this job; the action posts with its own tools.
    needs: [review, post]
    if: ${{ !cancelled() && needs.post.outputs.count == '0' && (needs.review.outputs.reason == 'quota' || needs.review.outputs.reason == 'no-key') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the action posts the review comments
      issues: read
      id-token: write # claude-code-action
    env:
      MARKER: '<!-- ai-review:${{ github.event.pull_request.head.sha }} -->'
      TOOLS: Read,Glob,Grep,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments*)
      SYSTEM_PROMPT: This repository keeps its project rules in AGENTS.md files and REVIEW.md and has no CLAUDE.md. The working tree holds the PR-base versions of REVIEW.md, AGENTS.md, ARCHITECTURE.md, CONTEXT.md, PRODUCT.md, DESIGN.md, docs/adr and docs/agents; judge the PR by those, not by the PR's edits to them. The head SHA of this PR is ${{ github.event.pull_request.head.sha }}; the summary comment starts with the line <!-- ai-review:${{ github.event.pull_request.head.sha }} -->.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Same rule as in the `review` job: the review knowledge comes from the PR base.
      - name: Knowledge files from the PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          kb='^(REVIEW|ARCHITECTURE|CONTEXT|PRODUCT|DESIGN)\.md$|(^|/)AGENTS\.md$|^docs/(adr|agents)/|(^|/)\.claude/|(^|/)CLAUDE(\.local)?\.md$|^\.mcp\.json$'
          git ls-files -z | grep -zE "$kb" | xargs -0 -r rm -f
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git ls-tree -r -z --name-only FETCH_HEAD | grep -zE "$kb" | xargs -0 -r git checkout FETCH_HEAD --
          git status --short
      - name: Review (subscription fallback)
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1' # see the `review` job (issue #133)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Show Claude's final text in the run's Step Summary. Trusted input only: fork and bot PRs skip this job.
          display_report: true
          prompt: '/vaultme-pr-review ${{ github.event.pull_request.number }} --comment'
          claude_args: |
            --allowedTools "${{ env.TOOLS }}"
            --append-system-prompt "${{ env.SYSTEM_PROMPT }} Stage 1 of this review may have failed after it posted some inline comments on this head SHA. Read the existing review comments first and do not post a finding that a bot comment already reports."
            --model sonnet

  require:
    # No summary and no fallback review: fail, so a missing review is visible and no subscription quota is spent.
    needs: [review, post, fallback]
    if: ${{ !cancelled() && needs.review.result != 'skipped' && needs.post.outputs.count == '0' && needs.fallback.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          REASON: ${{ needs.review.outputs.reason }}
        run: |
          echo "::error::No review summary for ${{ github.event.pull_request.head.sha }}: review job ${{ needs.review.result }} (API step ${{ needs.review.outputs.api }}), post job ${{ needs.post.result }}, reason '${REASON:-none}'. The subscription fallback runs only for no-key or quota."
          exit 1
