name: claude-code-review

# One Claude review per PR (docs/agents/workflow.md step 7), so no `synchronize`.
# Based on https://code.claude.com/docs/en/github-actions#run-a-skill
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, so they skip; request a CodeRabbit review there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The repo forbids CLAUDE.md (check-repo-rules.sh R9); the skill audits "CLAUDE.md" rules.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This repository keeps its project rules in AGENTS.md files (root and apps/mobile, packages/tokens) and has no CLAUDE.md. Wherever the review asks for CLAUDE.md files, use the AGENTS.md files at the same paths instead."
