name: claude-code-review

# Claude reviews a PR once when it is ready (opened as non-draft, or marked ready), and again each time the owner adds
# the `review` label (docs/agents/workflow.md step 7). No `synchronize`: work-in-progress pushes use no quota.
# The review is the repo skill .claude/skills/vaultme-pr-review (REVIEW.md, issue #212). claude-code-action restores
# .claude/ from the PR base, so a PR cannot change its own reviewer. Based on
# https://code.claude.com/docs/en/github-actions#run-a-skill
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, so they skip; the owner reviews them by hand.
    # Bot PRs (Renovate, Dependabot) skip too: claude-code-action rejects bot actors, so the check would always fail.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'review') ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 30 # five agents that read code outside the diff
    permissions:
      contents: read
      pull-requests: write # remove the `review` label
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      # The review rules come from the PR base, never from the PR head (REVIEW.md, issue #212): the head versions of the
      # knowledge files are removed, then the base versions are checked out. claude-code-action restores only .claude/ and
      # CLAUDE.md this way (docs/security.md, v1.0.252). The PR's own edits to these files stay visible in `gh pr diff`.
      # Remove this step when claude-code-action can restore more paths from the base branch.
      - name: Knowledge files from the PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          kb='^(REVIEW|ARCHITECTURE|CONTEXT|PRODUCT|DESIGN)\.md$|(^|/)AGENTS\.md$|^docs/(adr|agents)/'
          git ls-files -z | grep -zE "$kb" | xargs -0 -r rm -f
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git ls-tree -r -z --name-only FETCH_HEAD | grep -zE "$kb" | xargs -0 -r git checkout FETCH_HEAD --
          git status --short
      # The label asks for one more review; remove it so the owner can add it again after the next fix.
      - if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label review
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        # In -p mode subagents start in the background and Claude can end its turn while they run.
        # The action stops at that first result, so nothing was posted (issue #133).
        # This makes Claude wait for every subagent: https://code.claude.com/docs/en/sub-agents#let-claude-wait-for-a-subagent
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Show Claude's final text in the run's Step Summary. Trusted input only: fork and bot PRs skip this job.
          display_report: true
          prompt: '/vaultme-pr-review ${{ github.event.pull_request.number }} --comment'
          # Sonnet runs the skill and the finders (.claude/agents/review-finder.md); Opus verifies (review-verifier.md).
          claude_args: |
            --allowedTools "Read,Glob,Grep,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh api repos/HyeokjaeChoi/vaultme/pulls/*/comments*)"
            --append-system-prompt "This repository keeps its project rules in AGENTS.md files and REVIEW.md and has no CLAUDE.md. The working tree holds the PR-base versions of REVIEW.md, AGENTS.md, ARCHITECTURE.md, CONTEXT.md, PRODUCT.md, DESIGN.md, docs/adr and docs/agents; judge the PR by those, not by the PR's edits to them."
            --model sonnet
