name: claude-code-review

# One Claude review per PR (docs/agents/workflow.md step 7), so no `synchronize`.
# Based on https://code.claude.com/docs/en/github-actions#run-a-skill
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, so they skip; the owner reviews them by hand.
    # Bot PRs (Renovate, Dependabot) skip too: claude-code-action rejects bot actors, so the check would always fail.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # recent runs took 1.5-3 min; sequential agents get 5x margin
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      # The review rules come from the PR base, never from the PR head (REVIEW.md, issue #212): the head versions of the
      # knowledge files are removed, then the base versions are checked out. claude-code-action restores only .claude/ and
      # CLAUDE.md this way (docs/security.md, v1.0.252). The PR's own edits to these files stay visible in `gh pr diff`.
      # Remove this step when claude-code-action can restore more paths from the base branch.
      - name: Knowledge files from the PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          kb='^(REVIEW|ARCHITECTURE|CONTEXT|PRODUCT|DESIGN)\.md$|(^|/)AGENTS\.md$|^docs/(adr|agents)/'
          git ls-files | grep -E "$kb" | xargs -r rm -f
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git ls-tree -r --name-only FETCH_HEAD | grep -E "$kb" | xargs -r git checkout FETCH_HEAD --
          git status --short
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        # The skill starts its review agents in the background and ends its turn while they run.
        # The action stops at that first result, so nothing was posted (issue #133).
        # This makes Claude wait for every subagent: https://code.claude.com/docs/en/sub-agents#let-claude-wait-for-a-subagent
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Show Claude's final text in the run's Step Summary. Trusted input only: fork and bot PRs skip this job.
          display_report: true
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The repo forbids CLAUDE.md (check-repo-rules.sh R9); the skill audits "CLAUDE.md" rules.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
            --append-system-prompt "This repository keeps its project rules in AGENTS.md files (root and apps/mobile, apps/web, packages/tokens) and has no CLAUDE.md. Wherever the review asks for CLAUDE.md files, use the AGENTS.md files at the same paths instead, and also the root REVIEW.md, which applies to every file. Follow REVIEW.md for what to read per changed path, the four axes, what not to flag, and the output: every posted finding names and links the rule, ADR, invariant or lesson it breaks. The working tree holds the PR-base versions of REVIEW.md, AGENTS.md, ARCHITECTURE.md, CONTEXT.md, PRODUCT.md, DESIGN.md and docs/; judge the PR by those, not by the PR's edits to them. When no issue is found, the summary comment also lists the files you read because REVIEW.md names them. If step 1 stops the review only because the PR does not need code review, still post one summary comment with gh pr comment that gives the reason; post nothing when the PR is closed, a draft, or already has a Claude comment."
            --model opus
