name: web-staging

# Deploys apps/web to the `staging` env in wrangler.jsonc at https://vaultme-staging.stack-line.dev (custom domain from
# wrangler.jsonc; production domains are issue #198). Jobs `gate` and `lhci` run the same workerd checks as CI `web` and `lhci` first (build,
# wrangler dev + Playwright/axe, Lighthouse); `deploy` runs only if it passes. Same GitHub Environment `staging` as
# api-staging: secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, variable STAGING_API_URL (the CSP connect-src).
# The deploy needs a token that may edit Workers custom domains and DNS in zone stack-line.dev.
on:
  push:
    branches: [main]
    paths:
      [
        apps/web/**,
        packages/tokens/**,
        packages/i18n/**,
        packages/config/**,
        pnpm-lock.yaml,
        .github/workflows/web-staging.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-staging
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    # vars.STAGING_API_URL lives in the staging environment. This job uses no secrets.
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
      - run: pnpm --filter @vaultme/web exec playwright install --only-shell chromium
      - run: pnpm --filter @vaultme/web run test:e2e
      # The staging build adds the Web Analytics beacon: check its tag and CSP with a stub beacon (e2e/analytics.spec.ts).
      # The lhci jobs below run on the build without it: the JS budget counts the app's own JS (ADR-0012).
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
          WEB_ANALYTICS_TOKEN: 833254677ed141c3aad48ed2f87f05d9
      - run: pnpm --filter @vaultme/web exec playwright test e2e/analytics.spec.ts

  lhci:
    name: lhci (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
      - run: pnpm --filter @vaultme/web run lhci:${{ matrix.profile }}

  deploy:
    needs: [gate, lhci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Wrangler from the lockfile (7-day release age), not a separate action.
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      # WEB_API_ORIGIN goes into the CSP connect-src; WEB_ANALYTICS_TOKEN adds the beacon; builds stay noindex (WEB_ENV unset), ADR-0012.
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
          # Cloudflare Web Analytics site vaultme-staging.stack-line.dev (ADR-0012). A public beacon id, not a secret.
          WEB_ANALYTICS_TOKEN: 833254677ed141c3aad48ed2f87f05d9
      # The token is set only on the deploy step, so install and build scripts cannot read it.
      - run: pnpm --filter @vaultme/web exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          WEB_ANALYTICS_TOKEN: 833254677ed141c3aad48ed2f87f05d9
        run: |
          url=https://vaultme-staging.stack-line.dev
          # A new custom domain needs a moment for DNS and the certificate: retry the connection.
          status=$(curl -sS --retry 20 --retry-all-errors --retry-delay 6 -o body.html -D headers.txt -w '%{http_code}' "$url/smoke-no-such-page")
          cat headers.txt
          # A missing path answers a real 404 with the page, the security headers and noindex (acceptance of #192).
          [ "$status" = 404 ] || { echo "expected 404, got $status"; exit 1; }
          grep -q '404' body.html
          for h in content-security-policy strict-transport-security x-content-type-options referrer-policy permissions-policy; do
            grep -qi "^$h:" headers.txt || { echo "missing header $h"; exit 1; }
          done
          grep -qi '^x-robots-tag:.*noindex' headers.txt || { echo "missing X-Robots-Tag noindex"; exit 1; }
          # Web Analytics (ADR-0012): the beacon script is in the page and the CSP allows its script and RUM endpoint.
          grep -q "static.cloudflareinsights.com/beacon.min.js.*$WEB_ANALYTICS_TOKEN" body.html || { echo "404 page: no Web Analytics beacon"; exit 1; }
          grep -qi '^content-security-policy:.*script-src[^;]*static.cloudflareinsights.com' headers.txt || { echo "CSP lacks static.cloudflareinsights.com"; exit 1; }
          grep -qi '^content-security-policy:.*connect-src[^;]*cloudflareinsights.com' headers.txt || { echo "CSP lacks cloudflareinsights.com"; exit 1; }
          # The viewer and transaction pages are prerendered shells: 200 with no redirect (curl does not follow one), the same headers,
          # the app script (they hydrate) and the API origin of this build in the CSP. The balance read needs WebCrypto
          # and IndexedDB, which curl does not have, so a browser checks that after the deploy (e2e uses fixtures).
          for path in /address /en/address /tx /en/tx; do
            status=$(curl -sS -o page.html -D page-headers.txt -w '%{http_code}' "$url$path")
            [ "$status" = 200 ] || { echo "$path: expected 200, got $status"; cat page-headers.txt; exit 1; }
            for h in content-security-policy strict-transport-security x-content-type-options referrer-policy permissions-policy; do
              grep -qi "^$h:" page-headers.txt || { echo "$path: missing header $h"; exit 1; }
            done
            grep -qi '^x-robots-tag:.*noindex' page-headers.txt || { echo "$path: missing X-Robots-Tag noindex"; exit 1; }
            grep -qi "^content-security-policy:.*connect-src[^;]*${STAGING_API_URL}" page-headers.txt || { echo "$path: CSP connect-src lacks $STAGING_API_URL"; exit 1; }
            grep -q "src=\"https://static.cloudflareinsights.com/beacon.min.js\"[^>]*$WEB_ANALYTICS_TOKEN" page.html || { echo "$path: no Web Analytics beacon"; exit 1; }
            grep -q '__reactRouterContext' page.html || { echo "$path: not the hydrated viewer page"; exit 1; }
          done
