name: web-staging

# Deploys apps/web to the `staging` env in wrangler.jsonc at https://vaultme-staging.stack-line.dev (custom domain from
# wrangler.jsonc; production domains are issue #198). Jobs `gate` and `lhci` run the same workerd checks as CI `web` and `lhci` first (build,
# wrangler dev + Playwright/axe, Lighthouse); `deploy` runs only if it passes. Same GitHub Environment `staging` as
# api-staging: secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, variable STAGING_API_URL (the CSP connect-src).
# The deploy needs a token that may edit Workers custom domains and DNS in zone stack-line.dev.
# When the smoke fails after a successful deploy, `deploy` rolls the Worker back to the version that was live before it and
# runs the smoke again (DEP-1, ADR-0044).
on:
  push:
    branches: [main]
    paths:
      [
        apps/web/**,
        packages/api-client/**,
        packages/config/**,
        packages/contracts/**,
        packages/history/**,
        packages/i18n/**,
        packages/tokens/**,
        packages/wallet-core/**,
        pnpm-lock.yaml,
        .github/workflows/web-staging.yml,
      ]
  workflow_dispatch:
    inputs:
      rollback_drill:
        description: 'Drill (DEP-1, ADR-0044): after the deploy, fail the smoke on purpose, roll back, re-check and time it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-staging
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    # vars.STAGING_API_URL lives in the staging environment. This job uses no secrets.
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
      - run: pnpm --filter @vaultme/web exec playwright install --only-shell chromium
      - run: pnpm --filter @vaultme/web run test:e2e
      # The staging build adds the Web Analytics beacon: check its tag and CSP with a stub beacon (e2e/analytics.spec.ts).
      # The lhci jobs below run on the build without it: the JS budget counts the app's own JS (ADR-0012).
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
          WEB_ANALYTICS_TOKEN: 833254677ed141c3aad48ed2f87f05d9
      - run: pnpm --filter @vaultme/web exec playwright test e2e/analytics.spec.ts

  lhci:
    name: lhci (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
      - run: pnpm --filter @vaultme/web run lhci:${{ matrix.profile }}

  deploy:
    needs: [gate, lhci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    environment: staging
    outputs:
      rollback: ${{ steps.rollback.outcome }}
      recheck: ${{ steps.recheck.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Wrangler from the lockfile (7-day release age), not a separate action.
      - run: pnpm install --frozen-lockfile --filter @vaultme/web...
      # The version that serves traffic now: the rollback target. `deployments list --json` is sorted oldest first.
      - name: Active version before the deploy
        id: before
        run: |
          prev="$(pnpm --filter @vaultme/web exec wrangler deployments list --env staging --json 2>/dev/null | jq -r '(last // empty | .versions | max_by(.percentage) | .version_id) // empty' || true)"
          echo "version=$prev" >> "$GITHUB_OUTPUT"
          # The viewer page names its hashed assets: the same page after a rollback means the old assets are served again.
          echo "page=$(curl -sS --max-time 20 https://vaultme-staging.stack-line.dev/address | sha256sum | cut -c1-64 || true)" >> "$GITHUB_OUTPUT"
          echo "active version before the deploy: ${prev:-none}"
          [ -n "$prev" ] || echo "::warning::no active version found (first deploy, or the Cloudflare call failed): a failed smoke cannot be rolled back"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # WEB_API_ORIGIN goes into the CSP connect-src; WEB_ANALYTICS_TOKEN adds the beacon; builds stay noindex (WEB_ENV unset), ADR-0012.
      - run: pnpm --filter "@vaultme/web..." run build
        env:
          WEB_API_ORIGIN: ${{ vars.STAGING_API_URL }}
          # Cloudflare Web Analytics site vaultme-staging.stack-line.dev (ADR-0012). A public beacon id, not a secret.
          WEB_ANALYTICS_TOKEN: 833254677ed141c3aad48ed2f87f05d9
      # The token is set only on the deploy step, so install and build scripts cannot read it.
      - id: deploy
        run: pnpm --filter @vaultme/web exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        id: smoke
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          WEB_ANALYTICS_TOKEN: 833254677ed141c3aad48ed2f87f05d9
        run: apps/web/e2e-staging/smoke.sh
      # WEB-5 (#561): the viewer in a real browser with the real staging API: balances, history, a transaction page, 0 CSP
      # violations, 0 page errors, ready in 10 s. A failure rolls back like the curl smoke (ADR-0044). Needs no secret.
      - name: Viewer smoke with real staging data
        id: viewer
        run: |
          pnpm --filter @vaultme/web exec playwright install --only-shell chromium
          pnpm --filter @vaultme/web exec playwright test -c playwright.staging.config.ts
      # EVID-1 (ADR-0043): the numbers of that run.
      - name: Evidence file (viewer smoke)
        if: always() && hashFiles('apps/web/test-results/viewer-smoke.json') != ''
        run: |
          node packages/perf/src/cli.ts evidence emit --gate WEB-5 --origin "GitHub Actions, vaultme-staging.stack-line.dev" --tool "Playwright" \
            --out evidence-WEB-5.json --results apps/web/test-results/viewer-smoke.json
      - name: Upload the viewer evidence file
        if: always() && hashFiles('evidence-WEB-5.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-WEB-5
          path: evidence-WEB-5.json
          retention-days: 90
      # Drill: the smoke above passed, so this step is the only failure. continue-on-error keeps the job green when the
      # rollback and the re-check pass: the drill run is then the proof.
      - name: Drill, fail the smoke on purpose
        id: drill
        if: inputs.rollback_drill
        continue-on-error: true
        run: |
          echo "::warning::rollback drill: the smoke is failed on purpose"
          exit 1
      # Only after a successful deploy: a deploy that failed before the upload never downgrades the live version.
      - name: Roll back to the version before the deploy
        id: rollback
        if: always() && steps.deploy.outcome == 'success' && (failure() || steps.drill.outcome == 'failure')
        env:
          PREV: ${{ steps.before.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${PREV:?no version before this deploy: nothing to roll back to, fix forward}"
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          pnpm --filter @vaultme/web exec wrangler rollback "$PREV" --env staging --yes --message "smoke failed, rolled back: $RUN_URL"
          now="$(pnpm --filter @vaultme/web exec wrangler deployments list --env staging --json 2>/dev/null | jq -r 'last | .versions | max_by(.percentage) | .version_id')"
          [ "$now" = "$PREV" ] || { echo "active version is $now, expected $PREV"; exit 1; }
      - name: Re-check after the rollback
        id: recheck
        if: always() && steps.rollback.outcome == 'success'
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          WEB_ANALYTICS_TOKEN: 833254677ed141c3aad48ed2f87f05d9
          START: ${{ steps.rollback.outputs.start }}
          PAGE_BEFORE: ${{ steps.before.outputs.page }}
        run: |
          apps/web/e2e-staging/smoke.sh
          # The assets come back with the version: the viewer page is byte for byte the page before the deploy.
          after="$(curl -sS --max-time 20 https://vaultme-staging.stack-line.dev/address | sha256sum | cut -c1-64)"
          [ "$after" = "$PAGE_BEFORE" ] || { echo "::error::the viewer page after the rollback differs from the page before the deploy"; exit 1; }
          seconds=$(( $(date +%s) - START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "Rolled back and re-checked green in ${seconds} s (limit 120 s)." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$seconds" -le 120 ] || { echo "::error::rollback took ${seconds} s, limit 120 s"; exit 1; }
      # EVID-1 (ADR-0043): the rollback time, as an evidence file.
      - name: Evidence file
        if: always() && steps.recheck.outputs.seconds != ''
        env:
          SECONDS_TAKEN: ${{ steps.recheck.outputs.seconds }}
        run: |
          tool="wrangler $(pnpm --filter @vaultme/web exec wrangler --version 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ "$tool" != "wrangler " ] || tool=wrangler
          node packages/perf/src/cli.ts evidence emit --gate DEP-1-web --origin "GitHub Actions, vaultme-web-staging Worker" --tool "$tool" \
            --out evidence-DEP-1-web.json \
            --result "{\"metric\":\"Rollback until green re-check, web\",\"value\":$SECONDS_TAKEN,\"unit\":\"s\",\"threshold\":{\"op\":\"<=\",\"value\":120},\"n\":1,\"window\":\"one run\"}"
      - name: Upload the evidence file
        if: always() && hashFiles('evidence-DEP-1-web.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-DEP-1-web
          path: evidence-DEP-1-web.json
          retention-days: 90

  # A real rollback (not the drill) opens an issue, or comments on the open one: a person fixes forward.
  alert:
    needs: deploy
    if: always() && needs.deploy.outputs.rollback != '' && needs.deploy.outputs.rollback != 'skipped' && !inputs.rollback_drill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the rollback issue
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK: ${{ needs.deploy.outputs.rollback }}
          RECHECK: ${{ needs.deploy.outputs.recheck }}
          TITLE: 'deploy: staging web rolled back'
        run: |
          if [ "$ROLLBACK" = success ] && [ "$RECHECK" = success ]; then what="rolled back to the version before the deploy and the re-check passed"; else what="NOT rolled back or the re-check failed (rollback: $ROLLBACK, re-check: $RECHECK): the broken Worker may still serve traffic, fix it now"; fi
          body="The post-deploy smoke failed. Staging web Worker: $what. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (ADR-0044). Migrations stay. Fix forward on main."
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"; fi
