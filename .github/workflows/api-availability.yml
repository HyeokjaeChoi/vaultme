name: api-availability

# Weekly API availability SLO (API-6, ADR-0046): per route the share of responses below 500 over 28 days, 99.5 %, judged with at
# least 1,000 requests. Reads the Workers Analytics Engine `request` points with a read-only token. A breach opens one issue (or
# comments on the open one) and blocks nothing. Skips with a notice while the secret CF_ANALYTICS_TOKEN is not set.
on:
  schedule:
    # Monday 07:13 UTC, after ci-health. Not at the start of an hour (GitHub delays those).
    - cron: '13 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      issues: write # open or comment on the breach issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Query and check
        id: check
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          DATASET: ${{ vars.ANALYTICS_DATASET || 'vaultme_api_staging' }}
        run: |
          if [ -z "$CF_ANALYTICS_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::notice title=api-availability skipped::Set the secret CF_ANALYTICS_TOKEN (read-only Account Analytics) and the variable CF_ACCOUNT_ID (ADR-0046)."
            echo "breach=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node packages/perf/src/cli.ts availability sql "$DATASET" > query.sql
          curl -sS --fail-with-body -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/analytics_engine/sql" \
            -H "Authorization: Bearer $CF_ANALYTICS_TOKEN" --data-binary @query.sql -o answer.json
          rc=0
          node packages/perf/src/cli.ts availability check answer.json > availability.md || rc=$?
          { echo '### API availability, 28 days'; echo; cat availability.md; } | tee -a "$GITHUB_STEP_SUMMARY"
          # Exit 3 = a breach; 1 is any crash, which fails the job and opens no issue.
          echo "breach=$([ "$rc" = 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || [ "$rc" = 3 ]
      - name: Open or update the breach issue
        if: steps.check.outputs.breach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'perf: API availability SLO breach (28 days)'
        run: |
          { cat availability.md; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (ADR-0046)."; } > body.md
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md; fi
      - name: Evidence file (ADR-0043)
        # After the issue step: a failure here must not stop the breach issue. A normal PR commits the file (`evidence collect --run <id>`).
        if: hashFiles('answer.json') != ''
        run: >
          node packages/perf/src/cli.ts evidence emit --gate API-6 --origin 'GitHub Actions ubuntu-latest, Workers Analytics Engine SQL API'
          --tool 'packages/perf cli.ts availability' --from availability=answer.json --out evidence-API-6.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('evidence-API-6.json') != ''
        with:
          name: evidence-API-6
          path: evidence-API-6.json
          retention-days: 90
