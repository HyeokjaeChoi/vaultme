name: api-slo-window

# The UX SLO of the API over a 4-week window (ADR-0036): pools the per-request counts of every `api-bench` artifact of the last
# 28 days (weekly runs, manual runs and the release gate runs of release.yml) and checks good / total >= 95% per case and mode.
# A breach opens an issue (or comments on the open one). It never blocks a release; the release gate is the own-time check in api-bench.
on:
  schedule:
    # Monday 05:07 UTC, after api-bench (04:17, about 15 minutes). Not at the start of an hour.
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # list runs and download their artifacts
      issues: write # open or comment on the breach issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download the api-bench artifacts of the window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u -d '28 days ago' +%Y-%m-%d)"
          mkdir runs
          for wf in api-bench.yml release.yml; do
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --created ">=$since" --status completed --limit 200 --json databaseId --jq '.[].databaseId'); do
              # A run without the artifact (cancelled, or a release run that stopped before api-slo) adds nothing.
              gh run download "$id" --repo "$GITHUB_REPOSITORY" --name api-bench --dir "runs/$id" 2>/dev/null || rmdir "runs/$id" 2>/dev/null || true
            done
          done
      - name: Check the window
        id: check
        run: |
          rc=0
          node packages/perf/src/cli.ts slo-window --runs runs > window.md || rc=$?
          { echo '### API SLO, 4-week window'; echo; cat window.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "breach=$([ "$rc" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$rc" = 0 ] || [ "$rc" = 1 ]
      - name: Open or update the breach issue
        if: steps.check.outputs.breach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'perf: API SLO breach (4-week window)'
        run: |
          { cat window.md; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (ADR-0036)."; } > body.md
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md; fi
