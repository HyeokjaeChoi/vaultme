name: api-latency

# Weekly API latency on staging (ADR-0019). The job registers its own temporary install, so it needs no secret.
# The GitHub Environment `staging` is used only for the variable STAGING_API_URL (the Worker URL, no trailing slash).
on:
  schedule:
    # Monday 03:23 UTC. Not at the start of an hour: GitHub delays or drops scheduled runs at :00.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-latency
  cancel-in-progress: false

jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/perf...
      - name: Measure
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          : "${STAGING_API_URL:?set variable STAGING_API_URL in the staging environment}"
          rc=0
          node --experimental-transform-types --disable-warning=ExperimentalWarning packages/perf/src/cli.ts latency api-latency.json > latency.md || rc=$?
          { echo '### API latency (staging)'; echo; cat latency.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-latency
          path: api-latency.json
          retention-days: 90
          if-no-files-found: warn
