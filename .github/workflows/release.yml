# Release gate (#380, #378). A release is a `v*` tag. The tag run checks the funded wallet, runs the Maestro critical path on the
# iOS simulator and the Android emulator, and only when all pass builds the app with EAS. Failed flows retry once (run.sh); a retry
# pass continues and opens a "flaky e2e" issue; two failures stop the build. A tag run also runs the funded flows (#381): real Sepolia
# sends between two wallets of one phrase (iOS: A sends to B, Android: B sends to A), then the other wallet is restored and lists them.
# `dry_run` runs only the two critical paths: no balance check, no Environment (so no phrase), no funded flows, no EAS build.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the EAS build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MAESTRO_VERSION: 2.11.0 # same pin as e2e.yml
  MAESTRO_ZIP_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a # GitHub release asset digest of cli-2.11.0 maestro.zip

jobs:
  balance:
    # A dry run skips this job: the release Environment admits only v* tags, so a dispatch from a branch could not read it.
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: release # E2E_RELEASE_PHRASE lives only here
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter vaultme --filter @vaultme/wallet-core...
      - name: Funded wallet balance (ETH and USDC on Sepolia)
        # The secret is set on this step only, never on the job: install scripts of dependencies must not see it.
        env:
          MIN_ETH: '0.01'
          MIN_USDC: '1'
          E2E_RELEASE_PHRASE: ${{ secrets.E2E_RELEASE_PHRASE }}
        run: pnpm exec tsx scripts/release-balance.mts

  ios-critical:
    # After the balance check (no macOS minutes on a release that cannot send); a dry run skips the balance job.
    needs: balance
    if: ${{ !cancelled() && (needs.balance.result == 'success' || (inputs.dry_run == true && needs.balance.result == 'skipped')) }}
    runs-on: macos-26
    # A tag run reads the secret phrase for the funded flows, so it needs the Environment; a dry run (dispatch from a branch) has none.
    environment: ${{ inputs.dry_run != true && 'release' || '' }}
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write # the flaky e2e issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21 # Maestro needs Java 17 or newer
      - run: pnpm install --frozen-lockfile --filter vaultme --filter @vaultme/mobile... # root: tsx for the funded wallet addresses
      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Build the simulator app (Release, staging API)
        run: apps/mobile/.maestro/build-ios.sh
      - name: Boot a simulator
        run: |
          runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')
          type=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .identifier')
          udid=$(xcrun simctl create vaultme-e2e "$type" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run the critical flows (dry run)
        if: ${{ inputs.dry_run == true }}
        shell: bash # -eo pipefail: a failed run.sh fails the step even through tee
        run: apps/mobile/.maestro/run.sh critical 2>&1 | tee "$RUNNER_TEMP/critical.log"
      # The secret is set on the next two steps only, never on the job. Masks last for the rest of the job, so they get a step of their own
      # (the Maestro output is tee'd to a file, and the mask lines must not land in it).
      - name: Mask the recovery phrase
        if: ${{ inputs.dry_run != true }}
        env:
          E2E_RELEASE_PHRASE: ${{ secrets.E2E_RELEASE_PHRASE }}
        run: apps/mobile/.maestro/mask-phrase.sh
      - name: Run the critical and funded flows (wallet A sends to B)
        if: ${{ inputs.dry_run != true }}
        shell: bash # -eo pipefail: a failed run.sh fails the step even through tee
        env:
          E2E_RELEASE_PHRASE: ${{ secrets.E2E_RELEASE_PHRASE }}
        run: apps/mobile/.maestro/release-run.sh a 2>&1 | tee "$RUNNER_TEMP/critical.log"
      # run.sh prints `::warning::flaky ...` when a flow failed once and passed on the retry (#377).
      - name: Open a flaky e2e issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          grep -q '::warning::flaky' "$RUNNER_TEMP/critical.log" || exit 0
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "flaky e2e in release $REF_NAME" \
            --body "A critical flow failed once and passed on the retry in release run $url. Find the flow in the step log (lines with \`flaky\`) and fix the cause."
      # The create flow shows a generated recovery phrase: its screenshots and commands stay out of the public artifact (testnet-only, but never published).
      - if: ${{ !cancelled() && inputs.dry_run == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/mobile/e2e-report.xml
            apps/mobile/e2e-report-retry.xml
            apps/mobile/e2e-artifacts
            !apps/mobile/e2e-artifacts/**/create wallet through backup/**
          retention-days: 14
          if-no-files-found: warn
      # A tag run uploads only the JUnit reports: the funded flows type the real phrase, so their screenshots and command logs never leave the runner.
      # The check fails (and nothing is uploaded) when a phrase word is in a report; it prints the file, never the word.
      - name: Check the reports for phrase words
        id: guard
        if: ${{ !cancelled() && inputs.dry_run != true }}
        # A hit skips the upload, not the release: BIP39 has words like "wallet", "address", "home" that flow names also use.
        continue-on-error: true
        env:
          E2E_RELEASE_PHRASE: ${{ secrets.E2E_RELEASE_PHRASE }}
        run: apps/mobile/.maestro/check-no-phrase.sh apps/mobile/e2e-report.xml apps/mobile/e2e-report-retry.xml
      - if: ${{ !cancelled() && inputs.dry_run != true && steps.guard.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/mobile/e2e-report.xml
            apps/mobile/e2e-report-retry.xml
          retention-days: 14
          if-no-files-found: warn

  android-critical:
    # Same gate as ios-critical; the two run in parallel. GitHub-hosted ubuntu has KVM, so the emulator is hardware accelerated.
    needs: balance
    if: ${{ !cancelled() && (needs.balance.result == 'success' || (inputs.dry_run == true && needs.balance.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # A tag run reads the secret phrase for the funded flows, so it needs the Environment; a dry run (dispatch from a branch) has none.
    environment: ${{ inputs.dry_run != true && 'release' || '' }}
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write # the flaky e2e issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21 # Gradle (React Native) and Maestro
      - run: pnpm install --frozen-lockfile --filter vaultme --filter @vaultme/mobile... # root: tsx for the funded wallet addresses
      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Build the Release APK (staging API)
        run: apps/mobile/.maestro/build-android.sh
      # The Gradle build fills the 14 GB runner disk and the system image download then failed with "No space left on device" (run 4).
      # Keep the APK; delete the build caches and big preinstalled toolchains this job does not use.
      - name: Free disk space
        run: |
          rm -rf ~/.gradle apps/mobile/android/.gradle apps/mobile/android/build apps/mobile/android/app/build/intermediates apps/mobile/android/app/.cxx
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h /
      # The runner image has no /dev/kvm access for the runner user by default (rule from the action's README).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The action runs each line of `script` in its own shell, so the logic lives in run.sh. bash -o pipefail: a failed run.sh fails the step even through tee.
      - name: Run the critical flows on an emulator (dry run)
        if: ${{ inputs.dry_run == true }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 4 # 768x1280: the default 320x640 hid Receive and the word check (run 1); pixel_7 (1080x2400) froze the launcher on the software GPU (run 2)
          cores: 4
          ram-size: 4096M
          enable-hw-keyboard: true # no on-screen keyboard: it would cover the lower recovery phrase cells
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -change-locale ko-KR # the action's defaults + Korean: the flows match Korean text (ADR-0037, run.sh checks it)
          script: bash -o pipefail -c 'PLATFORM=android apps/mobile/.maestro/run.sh critical 2>&1 | tee "$RUNNER_TEMP/critical.log"'
      - name: Mask the recovery phrase
        if: ${{ inputs.dry_run != true }}
        env:
          E2E_RELEASE_PHRASE: ${{ secrets.E2E_RELEASE_PHRASE }}
        run: apps/mobile/.maestro/mask-phrase.sh
      - name: Run the critical and funded flows on an emulator (wallet B sends to A)
        if: ${{ inputs.dry_run != true }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_RELEASE_PHRASE: ${{ secrets.E2E_RELEASE_PHRASE }}
          PLATFORM: android
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 4 # 768x1280: the default 320x640 hid Receive and the word check (run 1); pixel_7 (1080x2400) froze the launcher on the software GPU (run 2)
          cores: 4
          ram-size: 4096M
          enable-hw-keyboard: true # no on-screen keyboard: it would cover the lower recovery phrase cells
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -change-locale ko-KR # the action's defaults + Korean: the flows match Korean text (ADR-0037, run.sh checks it)
          script: bash -o pipefail -c 'apps/mobile/.maestro/release-run.sh b 2>&1 | tee "$RUNNER_TEMP/critical.log"'
      # run.sh prints `::warning::flaky ...` when a flow failed once and passed on the retry (#377).
      - name: Open a flaky e2e issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          grep -q '::warning::flaky' "$RUNNER_TEMP/critical.log" || exit 0
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "flaky e2e in release $REF_NAME (Android)" \
            --body "A critical flow failed once and passed on the retry on Android in release run $url. Find the flow in the step log (lines with \`flaky\`) and fix the cause."
      # Same artifact rule as ios-critical: the create flow shows a generated recovery phrase, so its output stays out of the public artifact.
      - if: ${{ !cancelled() && inputs.dry_run == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-android
          path: |
            apps/mobile/e2e-report.xml
            apps/mobile/e2e-report-retry.xml
            apps/mobile/e2e-artifacts
            !apps/mobile/e2e-artifacts/**/create wallet through backup/**
          retention-days: 14
          if-no-files-found: warn
      # A tag run uploads only the JUnit reports: the funded flows type the real phrase, so their screenshots and command logs never leave the runner.
      # The check fails (and nothing is uploaded) when a phrase word is in a report; it prints the file, never the word.
      - name: Check the reports for phrase words
        id: guard
        if: ${{ !cancelled() && inputs.dry_run != true }}
        # A hit skips the upload, not the release: BIP39 has words like "wallet", "address", "home" that flow names also use.
        continue-on-error: true
        env:
          E2E_RELEASE_PHRASE: ${{ secrets.E2E_RELEASE_PHRASE }}
        run: apps/mobile/.maestro/check-no-phrase.sh apps/mobile/e2e-report.xml apps/mobile/e2e-report-retry.xml
      - if: ${{ !cancelled() && inputs.dry_run != true && steps.guard.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-android
          path: |
            apps/mobile/e2e-report.xml
            apps/mobile/e2e-report-retry.xml
          retention-days: 14
          if-no-files-found: warn

  # Release version rule (ADR-0034, #396): version name from the tag, build number = UTC date + count of release runs that day.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # count today's release.yml runs
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
      build: ${{ steps.v.outputs.BUILD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          # A dry run (from a branch) checks the rule with a sample tag; only a v* tag run builds.
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0' }}
        shell: bash # -eo pipefail: a rejected tag fails the step even through tee
        # The day and the count come from this run's own creation: a run that starts after midnight keeps its day, and two tags
        # on one day get different counts (runs created that day up to this one). A re-run of the same run keeps its number.
        run: |
          created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          day="${created%%T*}"
          count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --created "$day" --limit 200 --json databaseId --jq "[.[] | select(.databaseId <= $GITHUB_RUN_ID)] | length")"
          scripts/release-version.sh "$TAG" "$day" "$count" | tee -a "$GITHUB_OUTPUT"

  # The k6 API benchmark of staging (ADR-0019, ADR-0036): no answer or our own server time over budget stops the release like a
  # failed flow. The UX SLO is judged over 4 weeks by api-slo-window.yml and never blocks.
  api-slo:
    uses: ./.github/workflows/api-bench.yml

  eas-build:
    needs: [version, api-slo, balance, ios-critical, android-critical]
    # Only a v* tag builds (a manual run from a branch never does).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vaultme/mobile...
      # Official Expo action (installs eas-cli at a fixed version, logs in with the token). eas-cli is not a repo dependency:
      # its exact-pinned transitive packages (joi, minimatch, nanoid, ...) carry known advisories that osv-scanner blocks in the lockfile.
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 26.0.0 # published 2026-10-26; newer waits for the 7-day rule
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build (Android APK internal, iOS simulator)
        working-directory: apps/mobile
        # appVersionSource local (eas.json): EAS reads app.json, and the archive includes this uncommitted change (docs.expo.dev/build-reference/project-upload).
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          jq --arg v "$VERSION" --arg b "$BUILD" '.expo.version = $v | .expo.ios.buildNumber = $b | .expo.android.versionCode = ($b | tonumber)' app.json > app.json.tmp
          mv app.json.tmp app.json
          eas build --platform all --profile release-staging --non-interactive --message "$VERSION ($BUILD)"
