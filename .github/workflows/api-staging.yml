name: api-staging

# Deploys apps/api to the `staging` env in wrangler.jsonc.
# Needs the GitHub Environment `staging` with secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# and variable STAGING_API_URL (the Worker URL, no trailing slash). Create the D1 database once before
# the first run (`wrangler d1 create vaultme-api-staging`): migrations run first and cannot create it.
on:
  push:
    branches: [main]
    paths:
      [
        apps/api/**,
        packages/config/**,
        packages/contracts/**,
        packages/api-client/**,
        packages/perf/**,
        pnpm-lock.yaml,
        .github/workflows/api-staging.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual runs too: only main reaches staging (migrations are forward-only).
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Wrangler from the lockfile (7-day release age), not a separate action.
      - run: pnpm install --frozen-lockfile --filter @vaultme/api...
      # Migrations first, so the new Worker never runs on an old schema (ARCHITECTURE.md, Release).
      # The token is set per step, so dependency install scripts cannot read it.
      - run: pnpm --filter @vaultme/api exec wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter @vaultme/api exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          : "${STAGING_API_URL:?set variable STAGING_API_URL in the staging environment}"
          curl -fsS --retry 3 --retry-all-errors "$STAGING_API_URL/v1/health" | grep -q '"ok":true'
      # Post-deploy smoke (Q55): a signed install, one balance read (ETH and USDC) and one history read of the public
      # Sepolia USDC contract, through the real endpoints. Needs no secret: the install key is made in memory per run.
      - name: Smoke test (balance and history reads)
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          : "${STAGING_API_URL:?set variable STAGING_API_URL in the staging environment}"
          pnpm install --frozen-lockfile --filter @vaultme/perf...
          pnpm --filter @vaultme/perf run smoke
