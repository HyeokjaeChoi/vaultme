name: pr-description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependency bot PRs have no issue and long generated release notes, so they skip both rules.
          case "$AUTHOR" in renovate\[bot\]|dependabot\[bot\]) echo "Bot PR by $AUTHOR: skipped."; exit 0;; esac
          body=$BODY
          len=$(printf '%s' "$body" | LC_ALL=C.UTF-8 wc -m)
          echo "PR description: $len characters (limit 3500)"
          [ "$len" -le 3500 ] || { echo "::error::Keep the PR description at 3500 characters or less."; exit 1; }
          printf '%s' "$body" | grep -Eiq '(closes|fixes|resolves) #[0-9]+' || { echo "::error::Link the issue with 'Closes #N'."; exit 1; }

  # A changed app screen needs app-vs-Figma comparison images in the PR body: one light and one dark per
  # changed screen file. Name each image by mode in its alt text (e.g. ![S50 light](...), ![S50 dark](...)).
  # A combined app|Figma image counts once. Files whose diff only touches comments or formatting are not UI changes.
  figma-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | {filename, status, patch}' > files.jsonl
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          files = [json.loads(l) for l in open("files.jsonl") if l.strip()]
          ui = re.compile(r"^apps/mobile/(app|src/(pages|widgets|shared/ui|features/[^/]+/ui))/.*\.tsx$|^apps/web/app/((routes|shared/ui)/.*\.tsx|root\.tsx|app\.css)$")
          comment = re.compile(r"^\s*(//|/\*|\*|\*/|\{/\*)|^\s*$")
          base = subprocess.run(["git", "merge-base", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]], capture_output=True, text=True, check=True).stdout.strip()
          show = lambda sha, path: subprocess.run(["git", "show", f"{sha}:{path}"], capture_output=True, text=True, check=True).stdout
          # Head is already Prettier-formatted (CI verify runs prettier --check), so a format-only change equals Prettier(base).
          # Keep the version equal to package.json; a mismatch fails safe (the file counts as a UI change).
          fmt = lambda text, path: subprocess.run(["npx", "--yes", "prettier@3.9.10", "--stdin-filepath", path], input=text, capture_output=True, text=True, check=True).stdout
          def code_change(f):
              # Formatting or comments only: Prettier(merge-base) equals head once comment and blank lines are dropped.
              # If Prettier cannot format the base file, treat the file as a UI change.
              if f["status"] == "modified":
                  # Drop a leading /* */ or {/* */} span but keep the code after it on the same line.
                  # Also drop a trailing "// ..." comment (space before the slashes, so URLs in strings stay).
                  lead = lambda l: re.sub(r"\s+//\s.*$", "", re.sub(r"^\s*\{?/\*.*?\*/\}?", "", l))
                  code = lambda text: [s for s in map(lead, text.splitlines()) if not comment.match(s)]
                  try:
                      if code(fmt(show(base, f["filename"]), f["filename"])) == code(show(os.environ["HEAD_SHA"], f["filename"])):
                          return False
                  except subprocess.CalledProcessError:
                      return True
                  return True
              patch = f.get("patch")
              if patch is None:
                  return True  # binary or too large: treat as a change
              lines = [l[1:] for l in patch.splitlines() if l[:1] in "+-" and not l.startswith(("+++", "---"))]
              return any(not comment.match(l) for l in lines)
          changed = [f["filename"] for f in files if f["status"] != "removed" and ui.match(f["filename"]) and code_change(f)]
          if not changed:
              print("No app UI code changed."); sys.exit(0)
          print("App UI files changed:", *changed, sep="\n  ")
          body = os.environ.get("BODY") or ""
          m = re.search(r"^## Figma comparison\s*$(.*?)(?=^## |\Z)", body, re.M | re.S)
          if not m:
              print("::error::Add a '## Figma comparison' section with light and dark app-vs-Figma images per changed screen."); sys.exit(1)
          alts = [a.lower() for a in re.findall(r"!\[([^\]]*)\]\([^)]+\)", m.group(1)) + re.findall(r"<img [^>]*alt=\"([^\"]*)\"", m.group(1))]
          # One screen per route path: app/send/amount.tsx and src/pages/send/amount.tsx are "send/amount";
          # route groups such as (tabs) are dropped, and index or a PascalCase component file maps to its folder.
          # A web screen is a file in apps/web/app/routes ("web/<name>"); it needs 3 breakpoints (375, 768, 1280) per mode.
          # Web shared UI (header, buttons) changes every screen, so it counts as one screen here: the PR shows at least one.
          def screen(c):
              w = re.match(r"^apps/web/app/routes/(.+)\.tsx$", c)
              if w:
                  return "web/" + w.group(1)
              m = re.match(r"^apps/mobile/(?:app|src/pages)/(.+)\.tsx$", c)
              if not m:
                  return None
              parts = [p for p in m.group(1).split("/") if not p.startswith("(")]
              if len(parts) > 1 and (parts[-1] == "index" or parts[-1][:1].isupper()):
                  parts.pop()
              return "/".join(parts)
          names = {screen(c) for c in changed} - {None}
          web = {n for n in names if n.startswith("web/")}
          web_ui = any(c.startswith("apps/web/") for c in changed)
          # per mode: mobile screens count 1 image each, web screens 3 (one per breakpoint); web UI without a route file needs 3.
          screens = (len(names) - len(web)) + 3 * (len(web) or (1 if web_ui else 0))
          screens = screens or 1
          light = sum("light" in a for a in alts); dark = sum("dark" in a for a in alts)
          print(f"screens={screens} light={light} dark={dark}")
          # Web: every breakpoint (375, 768, 1280) must be named in an alt text, once per mode for each web screen.
          web_count = len(web) or (1 if web_ui else 0)
          for bp in ("375", "768", "1280") if web_count else ():
              for mode in ("light", "dark"):
                  n = sum(bp in a and mode in a for a in alts)
                  if n < web_count:
                      print(f"::error::'## Figma comparison' needs {web_count} {mode} image(s) with {bp} in the alt text; found {n}."); sys.exit(1)
          if light < screens or dark < screens:
              print(f"::error::'## Figma comparison' needs {screens} light and {screens} dark images (mode in the alt text); found {light} light, {dark} dark."); sys.exit(1)
          PY
