# CodeRabbit reads only about the first 3,800 characters of a PR description.
name: pr-description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          body=$(printf '%s' "$BODY" | sed '/<!-- This is an auto-generated comment: release notes by coderabbit.ai -->/,/<!-- end of auto-generated comment: release notes by coderabbit.ai -->/d')
          len=$(printf '%s' "$body" | LC_ALL=C.UTF-8 wc -m)
          echo "PR description: $len characters (limit 3500)"
          [ "$len" -le 3500 ] || { echo "::error::Keep the PR description at 3500 characters or less."; exit 1; }
          printf '%s' "$body" | grep -Eiq '(closes|fixes|resolves) #[0-9]+' || { echo "::error::Link the issue with 'Closes #N'."; exit 1; }

  # A changed app screen needs app-vs-Figma comparison images (light + dark) in the PR body.
  figma-comparison:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ui=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^apps/mobile/(app|src/(pages|widgets|shared/ui|features/[^/]+/ui))/.*\.tsx$' || true)
          [ -z "$ui" ] && { echo "No app UI files changed."; exit 0; }
          echo "App UI files changed:"; echo "$ui"
          section=$(printf '%s' "$BODY" | awk '/^## Figma comparison/{f=1;next} /^## /{f=0} f')
          [ -n "$section" ] || { echo "::error::Add a '## Figma comparison' section with app vs Figma images (light + dark) for each changed screen."; exit 1; }
          imgs=$(printf '%s' "$section" | grep -oE '!\[[^]]*\]\([^)]+\)|<img [^>]*src=' | wc -l)
          [ "$imgs" -ge 2 ] || { echo "::error::'## Figma comparison' needs at least 2 images (light + dark); found $imgs."; exit 1; }

