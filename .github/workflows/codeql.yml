name: codeql

# SEC-2: CodeQL dataflow scan of the app code (JS/TS) and of the workflows themselves (actions), suite security-extended.
# Results go to Security > Code scanning. Blocking is a repo ruleset setting ("Code scanning results", owner-only);
# Gate (SEC-2): 0 new alerts with security severity High or higher (security-severity >= 7.0). Medium is shown, not blocking.
# Decision 16: make "Code scanning results" required (severity: High or higher) after 2 weeks of green runs on main; the start
# date is the first green main run, reported to the orchestrator at merge.
# No `paths:` filter on purpose: a required check that is skipped by a path filter stays "pending" and blocks the merge.
# Action: github/codeql-action v4 (docs: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Tuesday 04:17 UTC. Not at the start of an hour: GitHub delays or drops scheduled runs at :00.
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
