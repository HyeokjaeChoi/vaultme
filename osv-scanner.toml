# Dated exceptions for osv-scanner (SEC-1, ADR-0047). osv-scanner reads this file next to pnpm-lock.yaml: in the PR scan and the weekly scan.
# Q74: a known vulnerability without an entry here fails the scan, whatever its severity. A fix is the first choice, an exception the last.
#
# An entry needs an id, a reason and ignoreUntil:
# - The reason starts with its scope: "dev: " for a dev or CI tool, or "shipped: no fix " for code that ships (only when no fix exists).
# - ignoreUntil is a date, at most 30 days ahead for dev and 14 days for shipped. From 00:00 UTC of that day the finding shows again.
# scripts/check-osv-exceptions.py (R18) fails the repo rules for an entry that breaks this or has expired. To renew an entry, change the date
# and the reason in a PR. To end it, delete it. Only [[IgnoredVulns]] with these three keys is allowed here (R18).
#
# The six findings of #481 (weekly scan of 2026-11-09). All are in dev and build tools, so they are not in the app:
# - `pnpm why -r` (2026-11-15): extract-zip, via puppeteer-core, lighthouse and @lhci/cli; zod 3, via @expo/cli, chromium-bidi and
#   @google/design.md; glob and deepmerge, via style-dictionary and the Expo build packages; minimatch, via eslint and typescript-estree.
# - The iOS bundle (`expo export --dev --no-minify --no-bytecode`, 2026-11-15) names 121 package folders and none of these versions.
# - No source file of apps/mobile, apps/web, apps/api or packages imports one of those tool packages.

