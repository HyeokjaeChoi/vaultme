# Restores the public BIP39 test vector (R10), address 0x9858EfFD232B4033E47d90003D41EC34EcaEda94, and lands on Home.
appId: dev.stackline.vaultme
---
- tapOn: '기존 지갑 복구'
# Each cell is tapped and filled without a trailing space. A space makes the app move focus to the next cell, and on the
# slow CI runner the next word's keys landed before that move, so words were lost (#376). After each word a tap on the
# plain description text closes the keyboard (the ScrollView has keyboardShouldPersistTaps="handled"), so the lower cells
# are not under it. Not hideKeyboard: it is flaky on iOS (Maestro known issue); the focused selector does not see a multiline TextInput.
- tapOn: '1번째 단어'
- inputText: 'abandon'
- tapOn: '복구 구문 단어를 순서대로 입력하세요.'
- tapOn: '2번째 단어'
