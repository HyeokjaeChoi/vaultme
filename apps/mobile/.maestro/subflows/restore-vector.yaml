# Restores the public BIP39 test vector (R10), address 0x9858EfFD232B4033E47d90003D41EC34EcaEda94, and lands on Home.
appId: dev.stackline.vaultme
---
- tapOn: '기존 지갑 복구'
# Each cell is tapped and filled without a trailing space. A space makes the app move focus to the next cell, and on the
# slow CI runner the next word's keys landed before that move, so words were lost (#376). After each word a tap on the
# plain description text closes the keyboard (the ScrollView has keyboardShouldPersistTaps="handled"), so the lower cells
# are not under it. The flow then waits for the keyboard to finish closing: a tap on cell 12 while it was still
# closing hit the keyboard's "i" key and the word went into cell 11 (#386).
# A wait after each cell tap: focusing cell 12 shrinks the body above the keyboard and scrolls the cell into view (Screen revealRef); on the slow CI runner
# the first key of 'about' landed before that finished and was lost ('bout', #417 run 41854256184).
# Not hideKeyboard: it is flaky on iOS (Maestro known issue); the focused selector does not see a multiline TextInput.
- extendedWaitUntil:
    visible: '1번째 단어'
    timeout: 15000
- tapOn: '1번째 단어'
- waitForAnimationToEnd:
    timeout: 3000
- inputText: 'abandon'
- tapOn: '복구 구문 단어를 순서대로 입력하세요.'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: '2번째 단어'
