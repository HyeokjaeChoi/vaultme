# Restores the public BIP39 test vector (R10), address 0x9858EfFD232B4033E47d90003D41EC34EcaEda94, and lands on Home.
appId: dev.stackline.vaultme
---
- tapOn: '기존 지갑 복구'
- tapOn: '1번째 단어'
# One word per command; a trailing space commits the word and the app moves focus to the next cell. On the slow CI runner
# the next word's first keys landed before that move, so words were lost (#376). Each word now waits until the next cell
# has focus (Maestro `focused` selector). hideKeyboard per word was tried and is flaky on iOS (Maestro known issue).
- inputText: 'abandon '
- assertVisible:
    text: '2번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '3번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '4번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '5번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '6번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '7번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '8번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '9번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '10번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '11번째 단어'
    focused: true
- inputText: 'abandon '
- assertVisible:
    text: '12번째 단어'
    focused: true
- inputText: 'about'
- hideKeyboard
- tapOn: '복구'
- assertVisible: '복구 완료'
- assertVisible: '.*0x9858.*'
- tapOn: '지갑 열기'
- assertVisible: 'Sepolia ETH'
