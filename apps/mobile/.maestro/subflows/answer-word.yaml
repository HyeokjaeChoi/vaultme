# On the word check screen (S04): if it asks for word N, type that word. The 3 asked positions are random, so the flow tries all 12.
appId: dev.stackline.vaultme
---
- runFlow:
    when:
      visible: '${N}번째 단어'
    commands:
      - tapOn:
          below: '${N}번째 단어'
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: ${output.words[N]}
      - waitForAnimationToEnd:
          timeout: 3000
      # iOS only: on Android hideKeyboard presses Back and would leave the screen (#382).
      - runFlow:
          when:
            platform: iOS
          commands:
            - hideKeyboard:
                optional: true
