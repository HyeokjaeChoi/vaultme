# On the word check screen (S04): if it asks for word N, type that word. The 3 asked positions are random, so the flow tries all 12.
# Return (single-line field: it blurs and closes the keyboard) instead of hideKeyboard, which is flaky on iOS and presses Back on Android (#382). A keyboard that stays up
# can cover the next asked cell, and the "visible" check would then skip it (#424: the hint under 확인 never cleared in CI).
appId: dev.stackline.vaultme
---
- runFlow:
    when:
      visible: '${N}번째 단어'
    commands:
      - tapOn:
          below: '${N}번째 단어'
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: ${output.words[N]}
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 3000
