# On the word check screen (S04): if it asks for word N, type that word. The 3 asked positions are random, so the flow tries all 12.
# Return instead of hideKeyboard, which is flaky on iOS and presses Back on Android (#382): on the first 2 cells it moves to the next asked cell
# (returnKeyType next, Screen scrolls it into view), on the last one it closes the keyboard (#449).
appId: dev.stackline.vaultme
---
- runFlow:
    when:
      visible: '${N}번째 단어'
    commands:
      - tapOn:
          below: '${N}번째 단어'
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: ${output.words[N]}
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 3000
