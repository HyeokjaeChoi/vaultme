# iOS offers to save the passphrase after it was typed into the masked field (system sheet "암호를 저장하겠습니까?", 지금 안 함 / 저장; issue #683).
# It comes at no fixed moment: over the restore result in iOS probe run 3 (44254721018, the address behind it was the right one, 0x55D4…), over Home in run 2
# (44246654627). While it is up, the screen behind is not visible to Maestro. A person taps "지금 안 함": a wait for the sheet, then that tap. iOS only.
appId: dev.stackline.vaultme
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: '지금 안 함'
          timeout: 8000
          optional: true
      - runFlow:
          when:
            visible: '지금 안 함'
          commands:
            - tapOn: '지금 안 함'
