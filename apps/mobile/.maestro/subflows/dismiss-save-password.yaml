# iOS offers to save the passphrase after it was typed into the masked field (system sheet "암호를 저장하겠습니까?", 지금 안 함 / 저장; issue #683).
# It comes at no fixed moment: over the restore result (iOS probe run 3, 44254721018: the address behind it was the right one, 0x55D4…), over Home right
# away (run 2, 44246654627) or later than 8 s after 지갑 열기 (run 4, 44263799485: Home was clean in the failure screenshot, so the sheet had come and gone).
# While it is up, the screen behind it is not visible to Maestro. A person taps "지금 안 함": up to 3 waits of 4 s for the sheet, a tap each time it shows. iOS only.
appId: dev.stackline.vaultme
---
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 3
          commands:
            - extendedWaitUntil:
                visible: '지금 안 함'
                timeout: 4000
                optional: true
            - runFlow:
                when:
                  visible: '지금 안 함'
                commands:
                  - tapOn: '지금 안 함'
