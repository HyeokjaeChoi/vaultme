# Restores the funded E2E wallet and lands on Home (#381). Params: PASSPHRASE ("" = none), PREFIX (first 6 characters of the expected address).
# The phrase comes from the shell env MAESTRO_PHRASE (Maestro docs: shell variables prefixed MAESTRO_ are readable in flows); 12 words.
appId: dev.stackline.vaultme
---
- tapOn: '기존 지갑 복구'
- extendedWaitUntil:
    visible: '1번째 단어'
    timeout: 15000
- tapOn: '1번째 단어'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: type-word.yaml
    env:
      N: 1
      WORD: ${MAESTRO_PHRASE.split(' ')[0]}
- runFlow:
    file: type-word.yaml
    env:
      N: 2
      WORD: ${MAESTRO_PHRASE.split(' ')[1]}
- runFlow:
    file: type-word.yaml
    env:
      N: 3
      WORD: ${MAESTRO_PHRASE.split(' ')[2]}
- runFlow:
    file: type-word.yaml
    env:
      N: 4
      WORD: ${MAESTRO_PHRASE.split(' ')[3]}
- runFlow:
    file: type-word.yaml
    env:
      N: 5
      WORD: ${MAESTRO_PHRASE.split(' ')[4]}
- runFlow:
    file: type-word.yaml
    env:
      N: 6
      WORD: ${MAESTRO_PHRASE.split(' ')[5]}
- runFlow:
    file: type-word.yaml
    env:
      N: 7
      WORD: ${MAESTRO_PHRASE.split(' ')[6]}
- runFlow:
    file: type-word.yaml
    env:
      N: 8
      WORD: ${MAESTRO_PHRASE.split(' ')[7]}
- runFlow:
    file: type-word.yaml
    env:
      N: 9
      WORD: ${MAESTRO_PHRASE.split(' ')[8]}
- runFlow:
    file: type-word.yaml
    env:
      N: 10
      WORD: ${MAESTRO_PHRASE.split(' ')[9]}
- runFlow:
    file: type-word.yaml
    env:
      N: 11
      WORD: ${MAESTRO_PHRASE.split(' ')[10]}
- runFlow:
    file: type-word.yaml
    env:
      N: 12
      WORD: ${MAESTRO_PHRASE.split(' ')[11]}
# Optional BIP39 passphrase: the row is collapsed; on the small Android screen scroll to it first.
- runFlow:
    when:
      # An empty shell value (wallet A has no passphrase) reaches the flow as the text 'undefined', not as '': Maestro prints
      # "Inputting text: undefined" in the Android dry run 44232240159, and A's restore then typed it and got another address
      # (tag run 44225225354, funded-2-receive). Covered by apps/mobile/test/restore-funded.test.ts.
      true: ${PASSPHRASE !== 'undefined' && PASSPHRASE.length > 0}
    commands:
      - scrollUntilVisible:
          element: '고급 · 패스프레이즈 입력'
          direction: DOWN
      - tapOn: '고급 · 패스프레이즈 입력'
      # Android: the field is the first element below the row.
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                below: '고급 · 패스프레이즈 입력'
      # iOS: below the row come the label Text and then the field, both named '패스프레이즈' (Input.tsx); the first tap hit the label, which takes
      # no focus, so the passphrase was never typed and B restored as A (tag run 44225225354 funded-2; iOS probe run 44237065347: 0x55D4 not shown;
      # maestro.log: "Tapping on element: accessibilityText=패스프레이즈, bounds=[16,562][359,582]", the label). The field is the closest element below the label.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                below: '패스프레이즈'
      - inputText: ${PASSPHRASE}
      # iOS only: on Android hideKeyboard presses Back and would leave the screen (#382). Optional: it is flaky on iOS.
      - runFlow:
          when:
            platform: iOS
          commands:
            - hideKeyboard:
                optional: true
# 복구 stays off until all 12 words are valid: wait for it to turn on, so a wrong word fails here and not 30 s later.
- extendedWaitUntil:
    visible:
      text: '복구'
      enabled: true
    timeout: 10000
- tapOn: '복구'
# Restore derives the BIP39 seed (PBKDF2), writes the Keychain and asks device auth: it can take longer than the 7 s assertVisible default
# on the CI simulator (Maestro docs: extendedWaitUntil is for waits longer than 7 s).
- extendedWaitUntil:
    visible: '복구 완료'
    timeout: 30000
- runFlow:
    when:
      true: ${PASSPHRASE !== 'undefined' && PASSPHRASE.length > 0}
    file: dismiss-save-password.yaml
- assertVisible: '(?i).*${PREFIX}.*'
- tapOn: '지갑 열기'
- runFlow:
    when:
      true: ${PASSPHRASE !== 'undefined' && PASSPHRASE.length > 0}
    file: dismiss-save-password.yaml
# The sheet can cover Home for a while: wait for Home or the sheet, dismiss, wait for Home, and look once more for a late sheet.
- extendedWaitUntil:
    visible: 'Sepolia ETH(, .*)?|지금 안 함'
    timeout: 30000
- runFlow:
    when:
      true: ${PASSPHRASE !== 'undefined' && PASSPHRASE.length > 0}
    file: dismiss-save-password.yaml
# Home's hero is one accessible element: once the balance has loaded iOS names it 'Sepolia ETH, 0 ETH. 테스트넷 자산은 …', and an exact 'Sepolia ETH' never
# matches (probe run 44276820026: clean Home in the screenshot, hierarchy 'Sepolia ETH, 0 ETH. …', the wait failed). Same cause as the AmountHero '보냈어요' pattern.
- extendedWaitUntil:
    visible: 'Sepolia ETH(, .*)?'
    timeout: 30000
