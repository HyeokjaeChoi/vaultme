# Cold start of a clean install: no app data, no Keychain item. The wallet-less app opens on the start screen.
appId: dev.stackline.vaultme
---
- launchApp:
    clearState: true
    clearKeychain: true
# A wait, not a retry: on a freshly booted CI simulator the first screen took longer than the 7 s assertVisible default (#668, run 43978051337).
- extendedWaitUntil:
    visible: '새 지갑 만들기'
    timeout: 30000
