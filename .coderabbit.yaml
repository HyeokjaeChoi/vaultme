# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Rule sources: AGENTS.md, ARCHITECTURE.md and the accepted ADRs in docs/adr/.
# CodeRabbit learnings only calibrate the reviewer. They hold no design facts.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  # No commit status on PRs while CodeRabbit is not used.
  review_status: false
  auto_review:
    # Off: Claude reviews each PR on open (.github/workflows/claude-code-review.yml). CodeRabbit is not used
    # (free plan quota, docs/agents/workflow.md step 5); this file stays for an owner-requested `@coderabbitai review`.
    enabled: false
    drafts: true
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/src/generated/**'
    - '!work/**'
  path_instructions:
    - path: 'packages/wallet-core/**'
      instructions: >-
        Judge against ARCHITECTURE.md (Invariants), docs/adr/ and AGENTS.md "Enforced rules" (scripts/check-repo-rules.sh R10).
        Amounts use decimal strings and bigint only, never Number. No IO, no React/RN.
        Recovery phrases and keys must never reach logs, errors, toString or JSON.
        Flag any state transition that is not in the ARCHITECTURE.md transaction state list.
    - path: 'apps/mobile/**'
      instructions: >-
        Judge against AGENTS.md, ARCHITECTURE.md, docs/adr/, DESIGN.md
        and CONTEXT.md.
        Use token values only (no raw hex or numeric spacing). Review screens show account,
        network, asset, full recipient, amount, estimated fee and status. Korean copy must
        match the CONTEXT.md glossary. 44 pt targets, accessibility labels on icon-only controls.
    - path: 'packages/tokens/**'
      instructions: >-
        Values come from packages/tokens/tokens.json only. Semantic and Component
        values alias Primitive tokens. Flag any raw value outside Primitive.
    - path: 'packages/i18n/**'
      instructions: >-
        Strings must follow CONTEXT.md.
    - path: 'docs/adr/**'
      instructions: >-
        An accepted ADR binds. Flag an edit that changes an accepted decision: it needs a new
        ADR that supersedes the old one.
    - path: '.github/workflows/**'
      instructions: >-
        Pin third-party actions to a full commit SHA with a version comment. Least privilege
        permissions. persist-credentials false on checkout.
  pre_merge_checks:
    docstrings:
      mode: 'off'
    custom_checks:
      - name: Verification evidence
        mode: warning
        instructions: >-
          Pass if every item the PR description reports as verified, passed or tested names
          the command that ran and where it ran. Fail if an item claims verification without
          a run, or if a step that could not run is not stated as not run.
      - name: Design system evidence
        mode: warning
        instructions: >-
          If the PR changes apps/mobile UI files or Figma screens, pass only when the description
          names the Figma node IDs used, links a light-mode app-vs-Figma image pair for each changed screen,
          and links at least one dark-mode pair. For Figma-only changes, require the audit.js result with all counts 0
          and also a screenshot of each changed screen and a dark-mode check of at least one frame.
          Otherwise pass.
      - name: Linked issue
        mode: warning
        instructions: >-
          Pass if the PR description links exactly one GitHub issue with "Closes #N".
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    eslint:
      enabled: true
knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - files: AGENTS.md
        applyTo: '**'
      - files: ARCHITECTURE.md
        applyTo: '**'
      - files: docs/agents/workflow.md
        applyTo: '**'
      - files: .claude/skills/vaultme-review-lessons/SKILL.md
        applyTo: '**'
      - files: .claude/skills/vaultme-design-to-code/SKILL.md
        applyTo: 'apps/**'
      - files: .claude/skills/vaultme-figma-screen/SKILL.md
        applyTo: '**'
